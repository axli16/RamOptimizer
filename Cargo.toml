[package]
name = "ramoptimizer"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading",
  "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_RemoteDesktop",
  "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
